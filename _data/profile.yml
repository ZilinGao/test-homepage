short_bio: >-
  <p>
    I am a Ph.D. candidate at Dalian University of Technology, working on computer vision,
    video understanding, and visual representation learning.
  </p>
  <p>
    My research interests include multimodal large language models, video understanding,
    image recognition, few-shot learning, and representation learning. My work has been
    published in leading conferences and journals, including CVPR, NeurIPS, IJCV, ACM MM,
    and IEEE TNNLS.
  </p>
  <p>
    I have published 9 papers and my work has received over 1,100 citations.
  </p>

